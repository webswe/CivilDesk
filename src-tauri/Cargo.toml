[package]
name = "civildesk"
default-run = "civildesk"
version = "0.1.1"
description = "CivilDesk desktop workspace"
authors = ["webswe"]
edition = "2021"
autobins = false

[[bin]]
name = "civildesk"
path = "src/main.rs"

[[bin]]
name = "brightspace-synthetic"
path = "src/bin/brightspace-synthetic.rs"
required-features = ["e2e-brightspace-fixture"]

[lib]
name = "civildesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# Routes the Notion client to a loopback mock. Compiled ONLY into the E2E binary; never enabled by default or in release builds.
notion-mock = []
e2e-brightspace-fixture = []
