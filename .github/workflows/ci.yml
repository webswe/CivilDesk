name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:e2e-isolation
      - run: npm run check:protected-install
      - run: node scripts/lib/frozen-package-verifier.node-test.mjs
      - shell: pwsh
        run: |
          ./scripts/test-protected-acl.ps1
          ./scripts/test-offline-policy.ps1
          ./scripts/test-installation-transition.ps1
      - run: npm test
      - run: npm run build
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles nsis
      - name: Verify Windows installer was built
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; found $($installers.Count)." }
          Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256 | Format-List
